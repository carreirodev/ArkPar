<!-- ArkPar's icon at 256 px: the files as a ring of blocks made whole again by a golden one,
     the recovery block, around the tick of a verification that passed.
     app/build-icon.ps1 renders it into ArkPar.ico. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b2fb0"/>
      <stop offset="0.55" stop-color="#2468f2"/>
      <stop offset="1" stop-color="#11c5d9"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.7" cy="0.25" r="0.65">
      <stop offset="0" stop-color="#fff" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe45c"/>
      <stop offset="1" stop-color="#ffa51f"/>
    </linearGradient>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0b1a5c" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="256" height="256" rx="56" fill="url(#sky)"/>
  <rect width="256" height="256" rx="56" fill="url(#glow)"/>

  <g filter="url(#lift)" fill="none" stroke-width="32">
    <!-- Five of the six blocks, 60 degrees each with a gap between them; the first place, at the top, is left free. -->
    <circle cx="128" cy="128" r="76" stroke="#fff" stroke-dasharray="0 79.587 67.587 12 67.587 12 67.587 12 67.587 12 67.587 12" stroke-dashoffset="-6"
            transform="rotate(-90 128 128)" pathLength="477.52"/>
    <!-- The golden recovery block takes that place. -->
    <circle cx="128" cy="128" r="76" stroke="url(#gold)" stroke-dasharray="67.587 409.933" stroke-dashoffset="-6"
            transform="rotate(-90 128 128)" pathLength="477.52"/>
    <path d="M97 130 L119 152 L161 106" stroke="#fff" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
