<!-- ArkPar's icon below 256 px: the ring of ArkPar-large.svg, thicker and without the tick and
     the shading, which blur at these sizes. app/build-icon.ps1 renders it into ArkPar.ico. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b2fb0"/>
      <stop offset="0.55" stop-color="#2468f2"/>
      <stop offset="1" stop-color="#11c5d9"/>
    </linearGradient>
    <linearGradient id="gold" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe45c"/>
      <stop offset="1" stop-color="#ffa51f"/>
    </linearGradient>
  </defs>

  <rect width="256" height="256" rx="56" fill="url(#sky)"/>

  <g fill="none" stroke-width="50">
    <circle cx="128" cy="128" r="70" stroke="#fff" stroke-dasharray="0 109.955 89.955 20 89.955 20 89.955 20" stroke-dashoffset="-10"
            transform="rotate(-90 128 128)" pathLength="439.82"/>
    <circle cx="128" cy="128" r="70" stroke="url(#gold)" stroke-dasharray="89.955 349.865" stroke-dashoffset="-10"
            transform="rotate(-90 128 128)" pathLength="439.82"/>
  </g>
</svg>
